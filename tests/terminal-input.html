<!doctype html>
<html lang="en">
  <meta charset="utf-8">
  <title>Terminal input regression check</title>
  <style>
    body { font: 16px system-ui; margin: 24px; }
    .term { width: 720px; height: 200px; margin: 12px 0; }
    pre { white-space: pre-wrap; }
  </style>
  <h1>Terminal input regression check</h1>
  <p>Local echo only. No SSH connection and no Claude requests.</p>
  <button id="run">Run input regressions</button>
  <pre id="results" role="status">Ready</pre>
  <h2>Manual input (fixed terminal)</h2>
  <p>Type several different Chinese phrases, mixed English, punctuation and emoji. Each commit should appear once below. Reload to reset.</p>
  <div id="fixed" class="term"></div>
  <pre id="received"></pre>
  <details><summary>Unpatched comparison</summary><div id="baseline" class="term"></div></details>
  <script type="module" src="./terminal-input.browser.ts"></script>
</html>
